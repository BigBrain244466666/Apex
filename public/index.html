<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>Apex Recomp & Health Tracker</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- ============ AUTH VIEW ============ -->
  <div id="auth-view" class="view hidden">
    <div class="auth-card">
      <h1 class="app-logo">Apex<span>Recomp</span></h1>
      <p class="tagline">Health &amp; Performance Tracker</p>

      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active">Sign In</button>
        <button id="tab-signup" class="auth-tab">Create Account</button>
      </div>

      <form id="auth-form" autocomplete="on">
        <label class="field-label" for="auth-email">Email</label>
        <input id="auth-email" type="email" required autocomplete="email" placeholder="you@example.com" />

        <label class="field-label" for="auth-password">Password</label>
        <input id="auth-password" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••" />

        <p id="auth-error" class="form-error hidden"></p>
        <button id="auth-submit" type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ============ DASHBOARD VIEW ============ -->
  <div id="dashboard-view" class="view hidden">
    <header class="topbar">
      <div class="topbar-brand">Apex<span>Recomp</span></div>
      <button id="logout-btn" class="btn btn-ghost">Sign Out</button>
    </header>

    <main class="dashboard">
      <!-- Macro progress -->
      <section class="card macro-card">
        <h2 class="card-title">Daily Macros</h2>
        <p class="card-sub" id="macro-date"></p>
        <div id="macro-bars" class="macro-bars"></div>
      </section>

      <!-- Huawei sleep card -->
      <section class="card huawei-card">
        <div class="card-head">
          <h2 class="card-title">Sleep</h2>
          <span id="huawei-status-badge" class="status-badge">…</span>
        </div>
        <div id="huawei-body" class="huawei-body">
          <p class="muted">Loading sleep data…</p>
        </div>
      </section>

      <!-- Meal log -->
      <section class="card meal-card">
        <h2 class="card-title">Meal Log</h2>

        <form id="meal-form" class="meal-form">
          <div class="meal-search-row">
            <input id="meal-food" type="text" placeholder="Search food (e.g. Swiss cheese)…" autocomplete="off" />
            <button type="button" id="food-search-btn" class="btn btn-outline">Search</button>
          </div>
          <div id="food-results" class="food-results hidden"></div>

          <div class="meal-macro-grid">
            <label>Calories <input id="meal-cal" type="number" min="0" required /></label>
            <label>Protein (g) <input id="meal-protein" type="number" min="0" step="0.1" required /></label>
            <label>Fat (g) <input id="meal-fat" type="number" min="0" step="0.1" required /></label>
            <label>Carbs (g) <input id="meal-carbs" type="number" min="0" step="0.1" required /></label>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Add Meal</button>
        </form>

        <div class="table-wrap">
          <table class="data-table" id="meal-table">
            <thead>
              <tr><th>Food</th><th>Cal</th><th>P</th><th>F</th><th>C</th><th></th></tr>
            </thead>
            <tbody id="meal-tbody"></tbody>
          </table>
        </div>
        <p class="meal-total" id="meal-total-row"></p>
      </section>

      <!-- Vitals -->
      <section class="card vitals-card">
        <h2 class="card-title">Weekly Progress &amp; Vitals</h2>

        <form id="vitals-form" class="vitals-form">
          <div class="vitals-grid">
            <label>Date <input id="vitals-date" type="date" required /></label>
            <label>Morning Weight (lbs) <input id="vitals-weight" type="number" step="0.1" min="0" /></label>
            <label>Waist (cm) <input id="vitals-waist" type="number" step="0.1" min="0" /></label>
          </div>
          <label>Strength / Gym Notes</label>
          <textarea id="vitals-notes" rows="2" placeholder="e.g. Squat 225×5, bench felt strong"></textarea>
          <button type="submit" class="btn btn-primary btn-block">Save Entry</button>
        </form>

        <div class="table-wrap">
          <table class="data-table" id="vitals-table">
            <thead>
              <tr><th>Date</th><th>Weight</th><th>7d Avg</th><th>Waist</th><th>Notes</th><th></th></tr>
            </thead>
            <tbody id="vitals-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/mealLog.js"></script>
  <script src="/js/vitals.js"></script>
  <script src="/js/huaweiCard.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
