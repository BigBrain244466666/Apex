<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />

  <!-- PWA / mobile app meta tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apex Recomp" />

  <title>Apex Recomp & Health Tracker</title>

  <!-- Favicon + app icon -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- ============ AUTH VIEW ============ -->
  <div id="auth-view" class="view hidden">
    <div class="auth-card">
      <h1 class="app-logo">Apex<span>Recomp</span></h1>
      <p class="tagline">Health &amp; Performance Tracker</p>
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active">Sign In</button>
        <button id="tab-signup" class="auth-tab">Create Account</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <label class="field-label" for="auth-email">Email</label>
        <input id="auth-email" type="email" required autocomplete="email" placeholder="you@example.com" />
        <label class="field-label" for="auth-password">Password</label>
        <input id="auth-password" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••" />
        <p id="auth-error" class="form-error hidden"></p>
        <button id="auth-submit" type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ============ APP (dashboard + gym) ============ -->
  <div id="dashboard-view" class="view hidden">
    <header class="topbar">
      <div class="topbar-brand">Apex<span>Recomp</span></div>
      <nav class="nav-tabs">
        <button id="nav-dashboard" class="nav-tab active">Dashboard</button>
        <button id="nav-gym" class="nav-tab">Gym</button>
      </nav>
      <button id="logout-btn" class="btn btn-ghost">Sign Out</button>
    </header>

    <!-- ============ PAGE: DASHBOARD ============ -->
    <main id="page-dashboard" class="dashboard">
      <section class="card macro-card">
        <h2 class="card-title">Daily Macros</h2>
        <p class="card-sub" id="macro-date"></p>
        <div id="macro-bars" class="macro-bars"></div>
      </section>

      <section class="card huawei-card">
        <div class="card-head">
          <h2 class="card-title">Sleep</h2>
          <span id="huawei-status-badge" class="status-badge">…</span>
        </div>
        <div id="huawei-body" class="huawei-body">
          <p class="muted">Loading sleep data…</p>
        </div>
      </section>

      <section class="card meal-card">
        <div class="card-head">
          <h2 class="card-title">Meals</h2>
          <button id="add-meal-btn" class="btn btn-outline">+ Add Meal</button>
        </div>
        <div id="meals-container"></div>
        <p class="meal-total" id="meal-total-row"></p>
      </section>
    </main>

    <!-- ============ PAGE: GYM ============ -->
    <main id="page-gym" class="gym-page hidden">
      <section class="card metrics-card">
        <h2 class="card-title">Body Metrics</h2>
        <form id="vitals-form" class="vitals-form">
          <div class="vitals-grid">
            <label>Date <input id="vitals-date" type="date" required /></label>
            <label>Morning Weight (lbs) <input id="vitals-weight" type="number" step="0.1" min="0" /></label>
            <label>Waist (cm) <input id="vitals-waist" type="number" step="0.1" min="0" /></label>
          </div>
          <label class="field-label">Strength / Gym Notes</label>
          <textarea id="vitals-notes" rows="2" placeholder="e.g. Squat 225×5, bench felt strong"></textarea>
          <button type="submit" class="btn btn-primary btn-block">Save Entry</button>
        </form>
        <div class="table-wrap">
          <table class="data-table" id="vitals-table">
            <thead>
              <tr><th>Date</th><th>Weight</th><th>7d Avg</th><th>Waist</th><th>Notes</th><th></th></tr>
            </thead>
            <tbody id="vitals-tbody"></tbody>
          </table>
        </div>
      </section>

      <section class="card workouts-card">
        <div class="card-head">
          <h2 class="card-title">Workouts</h2>
          <div class="new-workout-row">
            <input id="new-workout-date" type="date" />
            <button id="new-workout-btn" class="btn btn-primary">+ New Workout</button>
          </div>
        </div>
        <div id="workouts-container"></div>
      </section>

      <section class="card trends-card">
        <div class="card-head">
          <h2 class="card-title">Trends</h2>
          <select id="trend-exercise-select" class="trend-select">
            <option value="">— Select exercise —</option>
          </select>
        </div>
        <div id="trends-container"></div>
      </section>
    </main>
  </div>

  <!-- ============ MEAL TYPE MODAL ============ -->
  <div id="meal-type-modal" class="modal hidden">
    <div class="modal-backdrop" data-close-modal="meal-type-modal"></div>
    <div class="modal-card modal-small">
      <div class="modal-head">
        <h3>New Meal</h3>
        <button class="icon-btn" data-close-modal="meal-type-modal">✕</button>
      </div>
      <div class="meal-type-grid">
        <button class="meal-type-btn" data-type="breakfast">🍳 Breakfast</button>
        <button class="meal-type-btn" data-type="lunch">🥗 Lunch</button>
        <button class="meal-type-btn" data-type="dinner">🍽️ Dinner</button>
        <button class="meal-type-btn" data-type="snack">🍎 Snack</button>
      </div>
    </div>
  </div>

  <!-- ============ FOOD MODAL ============ -->
  <div id="food-modal" class="modal hidden">
    <div class="modal-backdrop" data-close-modal="food-modal"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="food-modal-title">Add Food</h3>
        <button class="icon-btn" data-close-modal="food-modal">✕</button>
      </div>
      <form id="food-form" class="food-form">
        <input id="food-search" type="text" placeholder="Search food (e.g. Swiss cheese)…" autocomplete="off" />
        <div id="food-results" class="food-results hidden"></div>
        <div id="serving-row" class="serving-row hidden">
          <label class="field-label">Serving size
            <input id="food-serving" type="number" min="0" step="1" value="100" />
          </label>
          <span class="serving-unit">grams</span>
          <span id="serving-note" class="serving-note"></span>
        </div>
        <div class="meal-macro-grid">
          <label>Calories <input id="food-cal" type="number" min="0" required /></label>
          <label>Protein (g) <input id="food-protein" type="number" min="0" step="0.1" required /></label>
          <label>Fat (g) <input id="food-fat" type="number" min="0" step="0.1" required /></label>
          <label>Carbs (g) <input id="food-carbs" type="number" min="0" step="0.1" required /></label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Add Food</button>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/mealLog.js"></script>
  <script src="/js/vitals.js"></script>
  <script src="/js/gym.js"></script>
  <script src="/js/huaweiCard.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
